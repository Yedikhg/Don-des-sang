name: Assistant checks
on:
  push:
    paths:
      - 'ai_service/**'
      - '.github/workflows/assistant-checks.yml'
  pull_request:
    paths:
      - 'ai_service/**'
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r ai_service/requirements.txt
      - run: python -m unittest discover -s ai_service -p 'test_*.py'
      - run: python -m compileall -q ai_service
